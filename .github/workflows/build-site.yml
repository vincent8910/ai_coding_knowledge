name: Build Site

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'terms/*.md'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/build-site-simple.js

      - name: Commit updated site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/pages.json docs/terms.json
          git diff --cached --quiet || git commit -m "chore: 自動更新網站內容"
          git push
